
<template>
    <div class="account-page">

        <div class="page-heading">
            <p class="eyebrow">SCENTSPHERE MEMBER AREA</p>
            <h1>My Account</h1>
            <p class="subtitle">Manage your profile and discover your order history.</p>
        </div>

        <template if:true={isLoading}>
            <div class="loading">
                <lightning-spinner alternative-text="Loading account"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="message error">
                Unable to load your account. Please refresh the page or contact support.
            </div>
        </template>

        <template if:true={accountData}>
            <div class="account-grid">

                <!-- Customer Profile -->
                <section class="profile-card">

                    <div class="profile-top">
                        <div class="avatar">{initials}</div>

                        <div>
                            <p class="eyebrow">WELCOME BACK</p>
                            <h2>{fullName}</h2>
                            <p class="member-since">Member since {customerSince}</p>
                        </div>
                    </div>

                    <div class="section-title">Personal Information</div>

                    <div class="detail-item">
                        <span>First Name</span>
                        <strong>{firstName}</strong>
                    </div>

                    <div class="detail-item">
                        <span>Last Name</span>
                        <strong>{lastName}</strong>
                    </div>

                    <div class="detail-item">
                        <span>Email Address</span>
                        <strong>{email}</strong>
                    </div>

                    <div class="detail-item">
                        <span>Username</span>
                        <strong>{username}</strong>
                    </div>

                    <div class="detail-item">
                        <span>Phone</span>
                        <strong>{phone}</strong>
                    </div>

                    <div class="detail-item address-item">
                        <span>Address</span>
                        <strong>{address}</strong>
                    </div>

                    <div class="detail-item">
                        <span>Account</span>
                        <strong>{accountName}</strong>
                    </div>

                    <!-- Logout -->
                    <button
                        class="logout-button"
                        onclick={handleLogout}>

                        <lightning-icon
                            icon-name="utility:logout"
                            size="x-small"
                            alternative-text="Logout">
                        </lightning-icon>

                        <span>Logout</span>
                    </button>

                </section>

                <!-- Customer Orders -->
                <section class="orders-card">

                    <div class="orders-heading">
                        <div>
                            <p class="eyebrow">YOUR PURCHASES</p>
                            <h2>My Orders</h2>
                        </div>

                        <div class="order-count">
                            {orders.length} Orders
                        </div>
                    </div>

                    <template if:true={hasOrders}>

                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Order</th>
                                        <th>Date</th>
                                        <th>Amount</th>
                                        <th>Order Status</th>
                                        <th>Payment</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <template for:each={formattedOrders} for:item="order">
                                        <tr key={order.Id}>
                                            <td class="order-number">{order.Name}</td>
                                            <td>{order.formattedDate}</td>
                                            <td class="amount">{order.formattedAmount}</td>
                                            <td>{order.Order_Status__c}</td>
                                            <td>{order.Payment_Status__c}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                    </template>

                    <template if:false={hasOrders}>
                        <div class="empty-orders">

                            <div class="empty-icon">
                                <lightning-icon
                                    icon-name="utility:shopping_bag"
                                    size="large"
                                    alternative-text="Shopping bag">
                                </lightning-icon>
                            </div>

                            <h3>No orders yet</h3>
                            <p>Your perfume purchases will appear here.</p>

                        </div>
                    </template>

                </section>

            </div>
        </template>

    </div>
</template>
