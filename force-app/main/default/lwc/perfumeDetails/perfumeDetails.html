
<template>
    <section class="details-container">

        <!-- Back Navigation -->
        <div class="back-navigation">
            <button
                class="back-button"
                onclick={handleBackNavigation}
                type="button">
                <span>←</span>
                {backButtonLabel}
            </button>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="message">
                <lightning-spinner
                    alternative-text="Loading perfume details"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={errorMessage}>
            <div class="message error-message">
                {errorMessage}
            </div>
        </template>

        <!-- Product Details -->
        <template if:true={perfume}>

            <div class="product-layout">

                <!-- Product Image -->
                <div class="image-section">

                    <template if:true={perfume.imageUrl}>
                        <img
                            src={perfume.imageUrl}
                            alt={perfume.Product_Name__c}
                            class="product-image" />
                    </template>

                    <template if:false={perfume.imageUrl}>
                        <div class="image-placeholder">
                            SCENTSPHERE
                        </div>
                    </template>

                </div>

                <!-- Product Information -->
                <div class="info-section">

                    <p class="eyebrow">{perfume.Brand__c}</p>

                    <h1>{perfume.Product_Name__c}</h1>

                    <p class="category">
                        {perfume.Category__c} Fragrance
                    </p>

                    <div class="price">
                        {perfume.formattedPrice}
                    </div>

                    <p class="description">
                        {perfume.Description__c}
                    </p>

                    <!-- Product Specifications -->
                    <div class="specifications">

                        <div class="spec-item">
                            <span>Size</span>
                            <strong>{perfume.Size__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Gender</span>
                            <strong>{perfume.Gender__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Category</span>
                            <strong>{perfume.Category__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Available Stock</span>
                            <strong>{perfume.Stock_Quantity__c}</strong>
                        </div>

                    </div>

                    <!-- Fragrance Notes -->
                    <template if:true={perfume.Fragrance_Notes__c}>
                        <div class="fragrance-notes">
                            <h3>Fragrance Notes</h3>
                            <p>{perfume.Fragrance_Notes__c}</p>
                        </div>
                    </template>

                    <!-- Out of Stock Message -->
                    <template if:true={isOutOfStock}>
                        <div class="out-of-stock-message">
                            <span>OUT OF STOCK</span>
                            <p>
                                This fragrance is currently unavailable.
                            </p>
                        </div>
                    </template>

                    <!-- Quantity -->
                    <div class="quantity-section">

                        <span>Quantity</span>

                        <div class="quantity-control">

                            <button
                                onclick={handleDecrease}
                                disabled={isOutOfStock}
                                type="button">
                                −
                            </button>

                            <span>{quantity}</span>

                            <button
                                onclick={handleIncrease}
                                disabled={isIncreaseDisabled}
                                type="button">
                                +
                            </button>

                        </div>
                    </div>

                    <!-- Total Price -->
                    <div class="total-price">
                        <span>Total Price</span>
                        <strong>{totalPrice}</strong>
                    </div>

                    <!-- Guest User: Sign In -->
                    <template if:true={isGuest}>

                        <template if:false={isOutOfStock}>

                            <button
                                class="add-to-cart-button"
                                onclick={handleLogin}
                                type="button">

                                <span>Sign In to Add to Cart</span>
                                <span class="cart-arrow">→</span>

                            </button>

                        </template>

                    </template>

                    <!-- Logged-In User: Add to Cart -->
                    <template if:false={isGuest}>

                        <button
                            class="add-to-cart-button"
                            onclick={handleAddToCart}
                            disabled={isAddToCartDisabled}
                            type="button">

                            <template if:true={isAddingToCart}>

                                <lightning-spinner
                                    alternative-text="Adding to cart"
                                    size="small">
                                </lightning-spinner>

                                <span>Adding to Cart...</span>

                            </template>

                            <template if:false={isAddingToCart}>

                                <template if:true={isOutOfStock}>
                                    <span>Currently Unavailable</span>
                                </template>

                                <template if:false={isOutOfStock}>
                                    <span>Add to Cart</span>
                                    <span class="cart-arrow">→</span>
                                </template>

                            </template>

                        </button>

                    </template>

                    <!-- Success Message -->
                    <template if:true={cartMessage}>
                        <p class="success-message">
                            {cartMessage}
                        </p>
                    </template>

                    <!-- Error Message -->
                    <template if:true={cartError}>
                        <p class="error-message">
                            {cartError}
                        </p>
                    </template>

                </div>
            </div>

            <!-- ======================================
                 RELATED FRAGRANCES SECTION
            ======================================= -->

            <section class="related-section">

                <div class="related-heading">

                    <p class="eyebrow">DISCOVER MORE</p>

                    <h2>More From This Category</h2>

                    <p>
                        Explore more fragrances from our
                        {perfume.Category__c} collection.
                    </p>

                </div>

                <!-- Related Products Loading -->
                <template if:true={relatedLoading}>

                    <div class="related-message">

                        <lightning-spinner
                            alternative-text="Loading related fragrances"
                            size="medium">
                        </lightning-spinner>

                    </div>

                </template>

                <!-- Related Products Error -->
                <template if:true={relatedError}>

                    <div class="related-message">

                        <p class="error-message">
                            {relatedError}
                        </p>

                        <button
                            class="related-retry-button"
                            onclick={handleRelatedRetry}
                            type="button">
                            Try Again
                        </button>

                    </div>

                </template>

                <!-- Related Product Cards -->
                <template if:true={hasRelatedProducts}>

                    <div class="related-grid">

                        <template
                            for:each={relatedProducts}
                            for:item="item">

                            <!-- FULL CLICKABLE CARD -->
                            <article
                                class="related-card"
                                key={item.Id}
                                data-id={item.Id}
                                onclick={handleRelatedProductClick}
                                onkeydown={handleRelatedCardKeydown}
                                tabindex="0"
                                role="link"
                                aria-label={item.Product_Name__c}>

                                <!-- Product Image -->
                                <div class="related-image-wrapper">

                                    <template if:true={item.imageUrl}>

                                        <img
                                            src={item.imageUrl}
                                            alt={item.Product_Name__c}
                                            class="related-image"
                                            data-id={item.Id}
                                            onerror={handleRelatedImageError}
                                            loading="lazy" />

                                    </template>

                                    <template if:false={item.imageUrl}>

                                        <div class="related-image-placeholder">
                                            <span>✦</span>
                                            <small>SCENTSPHERE</small>
                                        </div>

                                    </template>

                                    <!-- Out Of Stock Overlay -->
                                    <template if:true={item.isOutOfStock}>

                                        <div class="related-stock-overlay">

                                            <span>
                                                OUT OF STOCK
                                            </span>

                                        </div>

                                    </template>

                                </div>

                                <!-- Product Information -->
                                <div class="related-product-info">

                                    <p class="related-brand">
                                        {item.Brand__c}
                                    </p>

                                    <h3>
                                        {item.Product_Name__c}
                                    </h3>

                                    <p class="related-category">

                                        {item.Category__c}

                                        <template if:true={item.Size__c}>
                                            · {item.Size__c}
                                        </template>

                                    </p>

                                    <!-- Stock Status -->
                                    <template if:true={item.isOutOfStock}>

                                        <p class="related-unavailable">
                                            Out of Stock
                                        </p>

                                    </template>

                                    <!-- Price and Details -->
                                    <div class="related-bottom">

                                        <strong class="related-price">
                                            {item.formattedPrice}
                                        </strong>

                                        <!-- Span avoids nested clickable controls -->
                                        <span class="related-view-button">
                                            View Details →
                                        </span>

                                    </div>

                                </div>

                            </article>

                        </template>

                    </div>

                </template>

                <!-- No Related Products -->
                <template if:true={relatedEmpty}>

                    <div class="related-message">

                        <p>
                            No other fragrances in this category yet.
                            Explore our full collection instead.
                        </p>

                        <button
                            class="related-retry-button"
                            onclick={handleBackToShop}
                            type="button">
                            Explore Shop →
                        </button>

                    </div>

                </template>

                <!-- Pagination -->
                <template if:true={showRelatedPagination}>

                    <div class="related-pagination">

                        <button
                            class="pagination-button"
                            onclick={handleRelatedPrevious}
                            disabled={relatedPreviousDisabled}
                            type="button">
                            ← Previous
                        </button>

                        <span class="page-indicator">
                            Page {relatedPageNumber}
                            of {relatedTotalPages}
                        </span>

                        <button
                            class="pagination-button"
                            onclick={handleRelatedNext}
                            disabled={relatedNextDisabled}
                            type="button">
                            Next →
                        </button>

                    </div>

                </template>

            </section>

        </template>

    </section>
</template>
