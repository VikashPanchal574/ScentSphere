
<template>
    <section class="details-container">

        <!-- Back Navigation -->
        <div class="back-navigation">
            <button
                class="back-button"
                onclick={handleBackNavigation}
                type="button">
                <span>←</span>
                {backButtonLabel}
            </button>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="message">
                <lightning-spinner
                    alternative-text="Loading perfume details"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={errorMessage}>
            <div class="message error-message">
                {errorMessage}
            </div>
        </template>

        <!-- Product Details -->
        <template if:true={perfume}>
            <div class="product-layout">

                <!-- Product Image -->
                <div class="image-section">
                    <template if:true={perfume.imageUrl}>
                        <img
                            src={perfume.imageUrl}
                            alt={perfume.Product_Name__c}
                            class="product-image" />
                    </template>

                    <template if:false={perfume.imageUrl}>
                        <div class="image-placeholder">
                            SCENTSPHERE
                        </div>
                    </template>
                </div>

                <!-- Product Information -->
                <div class="info-section">

                    <p class="eyebrow">{perfume.Brand__c}</p>

                    <h1>{perfume.Product_Name__c}</h1>

                    <p class="category">
                        {perfume.Category__c} Fragrance
                    </p>

                    <div class="price">
                        {perfume.formattedPrice}
                    </div>

                    <p class="description">
                        {perfume.Description__c}
                    </p>

                    <!-- Product Specifications -->
                    <div class="specifications">

                        <div class="spec-item">
                            <span>Size</span>
                            <strong>{perfume.Size__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Gender</span>
                            <strong>{perfume.Gender__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Category</span>
                            <strong>{perfume.Category__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Available Stock</span>
                            <strong>{perfume.Stock_Quantity__c}</strong>
                        </div>

                    </div>

                    <!-- Fragrance Notes -->
                    <template if:true={perfume.Fragrance_Notes__c}>
                        <div class="fragrance-notes">
                            <h3>Fragrance Notes</h3>
                            <p>{perfume.Fragrance_Notes__c}</p>
                        </div>
                    </template>

                    <!-- Out of Stock Message -->
                    <template if:true={isOutOfStock}>
                        <div class="out-of-stock-message">
                            <span>OUT OF STOCK</span>
                            <p>This fragrance is currently unavailable.</p>
                        </div>
                    </template>

                    <!-- Quantity -->
                    <div class="quantity-section">
                        <span>Quantity</span>

                        <div class="quantity-control">
                            <button
                                onclick={handleDecrease}
                                disabled={isOutOfStock}
                                type="button">
                                −
                            </button>

                            <span>{quantity}</span>

                            <button
                                onclick={handleIncrease}
                                disabled={isIncreaseDisabled}
                                type="button">
                                +
                            </button>
                        </div>
                    </div>

                    <!-- Total Price -->
                    <div class="total-price">
                        <span>Total Price</span>
                        <strong>{totalPrice}</strong>
                    </div>

                    <!-- Add to Cart -->
                    <button
                        class="add-to-cart-button"
                        onclick={handleAddToCart}
                        disabled={isOutOfStock}>

                        <template if:true={isAddingToCart}>
                            <lightning-spinner
                                alternative-text="Adding to cart"
                                size="small">
                            </lightning-spinner>
                            <span>Adding to Cart...</span>
                        </template>

                        <template if:false={isAddingToCart}>
                            <template if:true={isOutOfStock}>
                                <span>Currently Unavailable</span>
                            </template>
                            <template if:false={isOutOfStock}>
                                <span>Add to Cart</span>
                                <span class="cart-arrow">→</span>
                            </template>
                        </template>
                    </button>

                    <!-- Success Message -->
                    <template if:true={cartMessage}>
                        <p class="success-message">{cartMessage}</p>
                    </template>

                    <!-- Error Message -->
                    <template if:true={cartError}>
                        <p class="error-message">{cartError}</p>
                    </template>

                </div>
            </div>
        </template>

    </section>
</template>
