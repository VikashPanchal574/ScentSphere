<template>
    <section class="details-container">

        <!-- BACK NAVIGATION -->
        <div class="back-navigation">
            <button class="back-button" onclick={handleBackNavigation} type="button">
                <span>←</span>
                {backButtonLabel}
            </button>
        </div>

        <!-- LOADING -->
        <template if:true={isLoading}>
            <div class="message">
                <lightning-spinner alternative-text="Loading perfume details" size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- ERROR -->
        <template if:true={errorMessage}>
            <div class="message error-message">
                {errorMessage}
            </div>
        </template>

        <!-- PRODUCT DETAILS -->
        <template if:true={perfume}>

            <div class="product-layout">

                <!-- PRODUCT IMAGE -->
                <div class="image-section">

                    <template if:true={perfume.imageUrl}>
                        <img src={perfume.imageUrl} alt={perfume.Product_Name__c} class="product-image" />
                    </template>

                    <template if:false={perfume.imageUrl}>
                        <div class="image-placeholder">
                            SCENTSPHERE
                        </div>
                    </template>

                </div>

                <!-- PRODUCT INFORMATION -->
                <div class="info-section">

                    <!-- BRAND -->
                    <p class="eyebrow">
                        {perfume.Brand__c}
                    </p>

                    <!-- NAME + WISHLIST -->
                    <div class="product-title-row">

                        <h1>{perfume.Product_Name__c}</h1>

                        <c-wishlist-button perfume-id={recordId}>
                        </c-wishlist-button>

                    </div>

                    <!-- CATEGORY -->
                    <p class="category">
                        {perfume.Category__c} Fragrance
                    </p>

                    <!-- PRICE -->
                    <div class="price">
                        {perfume.formattedPrice}
                    </div>

                    <!-- DESCRIPTION -->
                    <p class="description">
                        {perfume.Description__c}
                    </p>

                    <!-- SPECIFICATIONS -->
                    <div class="specifications">

                        <div class="spec-item">
                            <span>Size</span>
                            <strong>{perfume.Size__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Gender</span>
                            <strong>{perfume.Gender__c}</strong>
                        </div>

                        <div class="spec-item">
                            <span>Category</span>
                            <strong>{perfume.Category__c}</strong>
                        </div>

                        <!-- Available Stock number hidden.
                             Stock validation remains in JS/Apex. -->

                    </div>

                    <!-- FRAGRANCE NOTES -->
                    <template if:true={perfume.Fragrance_Notes__c}>

                        <div class="fragrance-notes">

                            <h3>Fragrance Notes</h3>

                            <div class="fragrance-note-items">

                                <template for:each={fragranceNoteItems} for:item="note">

                                    <span key={note.key} class="fragrance-note-chip">
                                        {note.label}
                                    </span>

                                </template>

                            </div>

                        </div>

                    </template>

                    <!-- OUT OF STOCK -->
                    <template if:true={isOutOfStock}>

                        <div class="out-of-stock-message">

                            <span>OUT OF STOCK</span>

                            <p>
                                This fragrance is currently unavailable.
                            </p>

                        </div>

                    </template>

                    <!-- QUANTITY -->
                    <div class="quantity-section">

                        <span>Quantity</span>

                        <div class="quantity-control">

                            <!-- DECREASE -->
                            <button onclick={handleDecrease} disabled={isOutOfStock} type="button"
                                aria-label="Decrease quantity">
                                −
                            </button>

                            <span>{quantity}</span>

                            <!-- INCREASE -->
                            <button onclick={handleIncrease} disabled={isIncreaseDisabled} type="button"
                                aria-label="Increase quantity">
                                +
                            </button>

                        </div>

                    </div>

                    <!-- ===================================
                         NEW: REMAINING CART QUANTITY
                    ==================================== -->

                    <template if:false={isGuest}>

                        <!-- CHECKING CART
                        <template if:true={isCartQuantityLoading}>

                            <p class="cart-quantity-hint">
                                Checking your cart quantity...
                            </p>

                        </template> -->

                        <!-- CART QUANTITY LOADED -->
                        <template if:true={cartQuantityLoaded}>

                            <!-- MORE QUANTITY AVAILABLE -->

                            <template if:true={showLowStockHint}>
                                <p class="cart-quantity-hint">
                                    {remainingQuantityMessage}
                                </p>
                            </template>

                        </template>

                    </template>

                    <!-- TOTAL PRICE -->
                    <div class="total-price">

                        <span>Total Price</span>

                        <strong>{totalPrice}</strong>

                    </div>

                    <!-- GUEST USER -->
                    <template if:true={isGuest}>

                        <template if:false={isOutOfStock}>

                            <button class="add-to-cart-button" onclick={handleLogin} type="button">

                                <span>
                                    Sign In to Add to Cart
                                </span>

                                <span class="cart-arrow">→</span>

                            </button>

                        </template>

                    </template>

                    <!-- LOGGED-IN USER -->
                    <template if:false={isGuest}>

                        <button class="add-to-cart-button" onclick={handleAddToCart} disabled={isAddToCartDisabled}
                            type="button">

                            <!-- ADDING -->
                            <template if:true={isAddingToCart}>

                                <lightning-spinner alternative-text="Adding to cart" size="small">
                                </lightning-spinner>

                                <span>Adding to Cart...</span>

                            </template>

                            <!-- NOT ADDING -->
                            <template if:false={isAddingToCart}>

                                <!-- OUT OF STOCK -->
                                <template if:true={isOutOfStock}>

                                    <span>
                                        Currently Unavailable
                                    </span>

                                </template>

                                <!-- IN STOCK -->
                                <template if:false={isOutOfStock}>

                                    <!-- QUANTITY AVAILABLE -->
                                    <template if:true={remainingAddableQuantity}>

                                        <span>Add to Cart</span>

                                        <span class="cart-arrow">
                                            →
                                        </span>

                                    </template>

                                    <!-- NO REMAINING QUANTITY -->
                                    <template if:false={remainingAddableQuantity}>

                                        <span>
                                            Maximum Quantity Reached
                                        </span>

                                    </template>

                                </template>

                            </template>

                        </button>

                    </template>

                    <!-- SUCCESS MESSAGE -->
                    <template if:true={cartMessage}>

                        <p class="success-message">
                            {cartMessage}
                        </p>

                    </template>

                    <!-- ERROR MESSAGE -->
                    <template if:true={cartError}>

                        <p class="error-message">
                            {cartError}
                        </p>

                    </template>

                </div>

            </div>

            <!-- ======================================
                 RELATED FRAGRANCES
            ======================================= -->

            <section class="related-section">

                <div class="related-heading">

                    <p class="eyebrow">
                        DISCOVER MORE
                    </p>

                    <h2>
                        More From This Category
                    </h2>

                    <p>
                        Explore more fragrances from our
                        {perfume.Category__c} collection.
                    </p>

                </div>

                <!-- RELATED LOADING -->
                <template if:true={relatedLoading}>

                    <div class="related-message">

                        <lightning-spinner alternative-text="Loading related fragrances" size="medium">
                        </lightning-spinner>

                    </div>

                </template>

                <!-- RELATED ERROR -->
                <template if:true={relatedError}>

                    <div class="related-message">

                        <p class="error-message">
                            {relatedError}
                        </p>

                        <button class="related-retry-button" onclick={handleRelatedRetry} type="button">
                            Try Again
                        </button>

                    </div>

                </template>

                <!-- RELATED PRODUCTS -->
                <template if:true={hasRelatedProducts}>

                    <div class="related-grid">

                        <template for:each={relatedProducts} for:item="item">

                            <article class="related-card" key={item.Id} data-id={item.Id}
                                onclick={handleRelatedProductClick} onkeydown={handleRelatedCardKeydown} tabindex="0"
                                role="link" aria-label={item.Product_Name__c}>

                                <!-- RELATED IMAGE -->
                                <div class="related-image-wrapper">

                                    <template if:true={item.imageUrl}>

                                        <img src={item.imageUrl} alt={item.Product_Name__c} class="related-image"
                                            data-id={item.Id} onerror={handleRelatedImageError} loading="lazy" />

                                    </template>

                                    <template if:false={item.imageUrl}>

                                        <div class="related-image-placeholder">

                                            <span>✦</span>

                                            <small>SCENTSPHERE</small>

                                        </div>

                                    </template>

                                    <!-- OUT OF STOCK -->
                                    <template if:true={item.isOutOfStock}>

                                        <div class="related-stock-overlay">
                                            <span>
                                                OUT OF STOCK
                                            </span>
                                        </div>

                                    </template>

                                </div>

                                <!-- RELATED PRODUCT DETAILS -->
                                <div class="related-product-info">

                                    <p class="related-brand">
                                        {item.Brand__c}
                                    </p>

                                    <h3>
                                        {item.Product_Name__c}
                                    </h3>

                                    <p class="related-category">

                                        {item.Category__c}

                                        <template if:true={item.Size__c}>
                                            · {item.Size__c}
                                        </template>

                                    </p>

                                    <!-- STOCK STATUS -->
                                    <template if:true={item.isOutOfStock}>

                                        <p class="related-unavailable">
                                            Out of Stock
                                        </p>

                                    </template>

                                    <!-- PRICE + DETAILS -->
                                    <div class="related-bottom">

                                        <strong class="related-price">
                                            {item.formattedPrice}
                                        </strong>

                                        <span class="related-view-button">
                                            View Details →
                                        </span>

                                    </div>

                                </div>

                            </article>

                        </template>

                    </div>

                </template>

                <!-- EMPTY RELATED PRODUCTS -->
                <template if:true={relatedEmpty}>

                    <div class="related-message">

                        <p>
                            No other fragrances in this category yet.
                            Explore our full collection instead.
                        </p>

                        <button class="related-retry-button" onclick={handleBackToShop} type="button">
                            Explore Shop →
                        </button>

                    </div>

                </template>

                <!-- PAGINATION -->
                <template if:true={showRelatedPagination}>

                    <div class="related-pagination">

                        <button class="pagination-button" onclick={handleRelatedPrevious}
                            disabled={relatedPreviousDisabled} type="button">
                            ← Previous
                        </button>

                        <span class="page-indicator">
                            Page {relatedPageNumber}
                            of {relatedTotalPages}
                        </span>

                        <button class="pagination-button" onclick={handleRelatedNext} disabled={relatedNextDisabled}
                            type="button">
                            Next →
                        </button>

                    </div>

                </template>

            </section>

        </template>

    </section>
</template>
