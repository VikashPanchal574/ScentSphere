
<template>
    <section class="hero">

        <!-- Background image -->
        <div class="hero-media">
            <img
                src={heroImage}
                alt="ScentSphere No. 05 eau de parfum with white flowers and purple silk"
                class="hero-image"
            />
            <div class="hero-shade"></div>
        </div>

        <!-- Text content -->
        <div class="hero-inner">
            <div class="hero-content">

                <p class="eyebrow rise rise-0">
                    PREMIUM FRAGRANCES
                </p>

                <h1 class="rise rise-1">
                    Discover Your
                    <span>Signature Scent</span>
                </h1>

                <p class="hero-description rise rise-2">
                    A curated collection of world-class perfumes
                    that define elegance, confidence, and individuality.
                </p>

                <!-- Hero Buttons -->
                <div class="hero-buttons rise rise-3">

                    <!-- Shop Button -->
                    <button
                        type="button"
                        class="primary-button"
                        onclick={handleShop}
                    >
                        Shop Now

                        <svg
                            class="button-arrow"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M4 12h15 M13 6l6 6-6 6"/>
                        </svg>
                    </button>

                    <!-- Collections Button -->
                    <button
                        type="button"
                        class="secondary-button"
                        onclick={handleCollections}
                    >
                        Explore Collections
                    </button>

                </div>

                <!-- Trust Features -->
                <ul class="trust-features rise rise-4">

                    <li class="trust-item">
                        <svg
                            class="trust-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15 M5 19c3-5 6-8 10-10"/>
                        </svg>

                        <span>100% Authentic Fragrances</span>
                    </li>

                    <li class="trust-item">
                        <svg
                            class="trust-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z M8.5 12l2.5 2.5 5-5"/>
                        </svg>

                        <span>Secure Payments</span>
                    </li>

                    <li class="trust-item">
                        <svg
                            class="trust-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M4 8h14 M15 5l3 3-3 3 M20 16H6 M9 13l-3 3 3 3"/>
                        </svg>

                        <span>Easy Returns</span>
                    </li>

                </ul>

            </div>
        </div>

    </section>
</template>
