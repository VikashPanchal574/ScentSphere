
<template>
    <template if:true={showHeader}>

        <div class="header-spacer">
            <div class="header-fixed">

                <!-- MAIN HEADER -->
                <header class="main-header">
                    <div class="header-container">

                        <!-- MOBILE MENU -->
                        <button
                            class="menu-toggle"
                            onclick={toggleMenu}
                            aria-label="Toggle menu"
                            aria-expanded={menuAriaExpanded}
                            type="button">
                            {menuIcon}
                        </button>

                        <!-- LOGO -->
                        <a
                            href="#"
                            class="brand"
                            onclick={handleHome}
                            aria-label="ScentSphere Home">

                            <svg
                                class="brand-mark"
                                viewBox="0 0 64 64"
                                aria-hidden="true">

                                <g
                                    transform="translate(32 32)"
                                    fill="none"
                                    stroke="#d4a050"
                                    stroke-width="1.3"
                                    stroke-linejoin="round">

                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(45)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(90)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(135)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(180)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(225)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(270)"/>
                                    <path d="M0 -29 C7 -21 7 -9 0 -3 C-7 -9 -7 -21 0 -29Z" transform="rotate(315)"/>

                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(22.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(67.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(112.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(157.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(202.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(247.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(292.5)"/>
                                    <path d="M0 -17 C3.6 -12 3.6 -6 0 -2 C-3.6 -6 -3.6 -12 0 -17Z" transform="rotate(337.5)"/>

                                    <circle
                                        r="2"
                                        fill="#c9923e"
                                        stroke="none"/>
                                </g>
                            </svg>

                            <span class="brand-text">
                                <span class="brand-name">
                                    SCENTSPHERE
                                </span>

                                <span class="brand-tag">
                                    THE ART OF FRAGRANCE
                                </span>
                            </span>
                        </a>

                        <!-- MAIN NAVIGATION -->
                        <nav
                            class={navClass}
                            aria-label="Main navigation">

                            <a
                                href="#"
                                class={homeClass}
                                onclick={handleHome}>
                                Home
                            </a>

                            <a
                                href="#"
                                class={shopClass}
                                onclick={handleShop}>
                                Shop
                            </a>

                            <a
                                href="#"
                                class={collectionsClass}
                                onclick={handleCollections}>
                                Collections
                            </a>

                            <a
                                href="#"
                                class={giftsClass}
                                onclick={handleGifts}>
                                Gifts
                            </a>

                            <a
                                href="#"
                                class={aboutClass}
                                onclick={handleAbout}>
                                About
                            </a>

                            <a
                                href="#"
                                class={contactClass}
                                onclick={handleContact}>
                                Contact
                            </a>
                        </nav>

                        <!-- HEADER ACTIONS -->
                        <div class="header-actions">

                            <!-- SEARCH -->
                            <div
                                class="search-area"
                                onfocusout={handleSearchFocusOut}>

                                <div class="search-box">

                                    <lightning-icon
                                        icon-name="utility:search"
                                        size="x-small"
                                        alternative-text="Search">
                                    </lightning-icon>

                                    <input
                                        type="search"
                                        placeholder="Search perfumes, notes, collections..."
                                        value={searchTerm}
                                        onfocus={handleSearchFocus}
                                        oninput={handleSearch}
                                        onkeydown={handleSearchKeydown}
                                        aria-label="Search perfumes"
                                        aria-autocomplete="list"
                                        aria-expanded={showSuggestions}
                                        aria-controls="perfume-suggestions"
                                        autocomplete="off"/>
                                </div>

                                <!-- SEARCH SUGGESTIONS -->
                                <template if:true={showSuggestions}>

                                    <div
                                        class="search-dropdown"
                                        id="perfume-suggestions"
                                        role="listbox"
                                        aria-label="Perfume suggestions">

                                        <div class="suggestion-heading">
                                            {suggestionHeading}
                                        </div>

                                        <!-- LOADING -->
                                        <template if:true={isSearchLoading}>
                                            <div class="suggestion-status">
                                                Searching perfumes...
                                            </div>
                                        </template>

                                        <!-- RESULTS -->
                                        <template if:false={isSearchLoading}>

                                            <template if:true={hasSuggestions}>

                                                <template
                                                    for:each={suggestions}
                                                    for:item="item">

                                                    <button
                                                        key={item.id}
                                                        class="suggestion-item"
                                                        type="button"
                                                        role="option"
                                                        data-id={item.id}
                                                        onclick={handleSuggestionClick}>

                                                        <span class="suggestion-image-box">

                                                            <template if:true={item.imageUrl}>
                                                                <img
                                                                    src={item.imageUrl}
                                                                    alt=""
                                                                    class="suggestion-image"/>
                                                            </template>

                                                            <template if:false={item.imageUrl}>
                                                                <lightning-icon
                                                                    icon-name="utility:photo"
                                                                    size="small"
                                                                    alternative-text="No image">
                                                                </lightning-icon>
                                                            </template>

                                                        </span>

                                                        <span class="suggestion-info">

                                                            <span class="suggestion-name">
                                                                {item.productName}
                                                            </span>

                                                            <span class="suggestion-brand">
                                                                {item.brand}

                                                                <template if:true={item.size}>
                                                                    · {item.size}
                                                                </template>
                                                            </span>

                                                        </span>

                                                        <span class="suggestion-price">
                                                            {item.formattedPrice}
                                                        </span>

                                                    </button>

                                                </template>

                                            </template>

                                            <!-- NO RESULTS -->
                                            <template if:false={hasSuggestions}>
                                                <div class="suggestion-status">
                                                    {suggestionEmptyMessage}
                                                </div>
                                            </template>

                                        </template>

                                        <!-- VIEW ALL RESULTS -->
                                        <template if:true={showViewAll}>

                                            <button
                                                type="button"
                                                class="suggestion-view-all"
                                                onclick={handleViewAllResults}>

                                                View all results for "{searchTerm}"

                                            </button>

                                        </template>

                                    </div>

                                </template>

                            </div>

                            <!-- ==================================
                                 LOGGED-IN USERS ONLY
                                 WISHLIST + CART
                            =================================== -->

                            <template if:false={isGuest}>

                                <!-- WISHLIST -->
                                <button
                                    class="action-button wishlist-btn"
                                    title="Wishlist"
                                    aria-label="Open Wishlist"
                                    onclick={handleWishlist}
                                    type="button">

                                    <lightning-icon
                                        icon-name="utility:heart"
                                        size="medium"
                                        alternative-text="Wishlist">
                                    </lightning-icon>

                                    <span class="count-badge">
                                        {wishlistCountLabel}
                                    </span>
                                </button>

                                <!-- SHOPPING CART -->
                                <button
                                    class="action-button cart-btn"
                                    title="Shopping Cart"
                                    aria-label="Open Shopping Cart"
                                    onclick={handleCart}
                                    type="button">

                                    <lightning-icon
                                        icon-name="utility:cart"
                                        size="medium"
                                        alternative-text="Cart">
                                    </lightning-icon>

                                    <span class="count-badge">
                                        {cartCountLabel}
                                    </span>
                                </button>

                                <!-- DIVIDER -->
                                <span class="action-divider"></span>

                            </template>

                            <!-- ==================================
                                 GUEST USER
                                 SIGN IN ONLY
                            =================================== -->

                            <template if:true={isGuest}>

                                <button
                                    class="account-button"
                                    onclick={handleLogin}
                                    title="Sign In"
                                    type="button">

                                    <lightning-icon
                                        icon-name="utility:user"
                                        size="x-small"
                                        alternative-text="Account">
                                    </lightning-icon>

                                    <span>Sign In</span>

                                </button>

                            </template>

                            <!-- ==================================
                                 LOGGED-IN USER
                                 FIRST NAME
                            =================================== -->

                            <template if:false={isGuest}>

                                <button
                                    class="account-chip"
                                    onclick={handleMyAccount}
                                    title="My Account"
                                    type="button">

                                    <span class="account-avatar">

                                        <lightning-icon
                                            icon-name="utility:user"
                                            size="x-small"
                                            alternative-text="Account">
                                        </lightning-icon>

                                    </span>

                                    <span class="account-label">
                                        {headerUsername}
                                    </span>

                                </button>

                            </template>

                        </div>
                    </div>
                </header>

                <!-- ==================================
                     SINGLE HEADER NOTIFICATION
                     WISHLIST + CART
                =================================== -->

                <template if:true={wishlistToastVisible}>

                    <div
                        class={wishlistToastClass}
                        role="status"
                        aria-live="polite">

                        <span class="wishlist-notice-icon">
                            ✓
                        </span>

                        <div class="wishlist-notice-content">

                            <strong>
                                {wishlistToastTitle}
                            </strong>

                            <span>
                                {wishlistToastMessage}
                            </span>

                        </div>

                        <button
                            class="wishlist-notice-close"
                            onclick={handleCloseWishlistToast}
                            type="button"
                            aria-label="Close notification">
                            ✕
                        </button>

                    </div>

                </template>

            </div>
        </div>

    </template>
</template>
