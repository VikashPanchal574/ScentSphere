<template>
    <template if:true={showHeader}>

      <div class="header-spacer">
       <div class="header-fixed">

        <!-- Announcement Bar -->
        <div class="announcement-bar">
            <div class="announcement-content">
                <span>Free Shipping on Orders Above ₹1,999</span>
                <span class="announcement-separator">✦</span>
                <span>First Order? Use Code <strong>SCENT10</strong> for 10% Off</span>
                <span class="announcement-separator">✦</span>
                <span>Luxury Fragrances, Crafted for You</span>
            </div>
        </div>

        <!-- Main Header -->
        <header class="main-header">
            <div class="header-container">

                <!-- Mobile Menu -->
                <button
                    class="menu-toggle"
                    onclick={toggleMenu}
                    aria-label="Toggle menu"
                    aria-expanded={menuAriaExpanded}
                    type="button">
                    {menuIcon}
                </button>

                <!-- Logo -->
                <a
                    href="#"
                    class="brand"
                    onclick={handleHome}
                    aria-label="ScentSphere Home">

                    <img
                        src={logoUrl}
                        class="brand-logo"
                        alt="ScentSphere - The Art of Fragrance"/>
                </a>

                <!-- Navigation -->
                <nav
                    class={navClass}
                    aria-label="Main navigation">

                    <a
                        href="#"
                        class={homeClass}
                        onclick={handleHome}>
                        Home
                    </a>

                    <a
                        href="#"
                        class={shopClass}
                        onclick={handleShop}>
                        Shop
                    </a>

                    <a
                        href="#"
                        class={collectionsClass}
                        onclick={handleCollections}>
                        Collections
                    </a>

                    <a
                        href="#"
                        class={giftsClass}
                        onclick={handleGifts}>
                        Gifts
                    </a>

                    <!-- About -->
                    <a
                        href="#"
                        class={aboutClass}
                        onclick={handleAbout}>
                        About
                    </a>

                    <!-- Contact -->
                    <a
                        href="#"
                        class={contactClass}
                        onclick={handleContact}>
                        Contact
                    </a>

                </nav>

                <!-- Header Actions -->
                <div class="header-actions">

                    <!-- Search -->
                    <div class="search-box">

                        <lightning-icon
                            icon-name="utility:search"
                            size="x-small"
                            alternative-text="Search">
                        </lightning-icon>

                        <input
                            type="search"
                            placeholder="Search perfumes..."
                            value={searchTerm}
                            oninput={handleSearch}
                            aria-label="Search perfumes"/>

                    </div>

                    <!-- Wishlist -->
                    <button
                        class="action-button wishlist-btn"
                        title="Wishlist"
                        onclick={handleWishlist}
                        type="button">

                        <lightning-icon
                            icon-name="utility:heart"
                            size="medium"
                            alternative-text="Wishlist">
                        </lightning-icon>

                        <span class="count-badge">
                            {wishlistCountLabel}
                        </span>

                    </button>

                    <!-- Shopping Cart -->
                    <button
                        class="action-button cart-btn"
                        title="Shopping Cart"
                        onclick={handleCart}
                        type="button">

                        <lightning-icon
                            icon-name="utility:cart"
                            size="medium"
                            alternative-text="Cart">
                        </lightning-icon>

                        <span class="count-badge">
                            {cartCountLabel}
                        </span>

                    </button>

                    <span class="action-divider"></span>

                    <!-- Guest User -->
                    <template if:true={isGuest}>

                        <button
                            class="account-button"
                            onclick={handleLogin}
                            type="button">

                            <lightning-icon
                                icon-name="utility:user"
                                size="x-small"
                                alternative-text="Account">
                            </lightning-icon>

                            <span>Sign In</span>

                        </button>

                    </template>

                    <!-- Logged In User -->
                    <template if:false={isGuest}>

                        <button
                            class="account-chip"
                            onclick={handleMyAccount}
                            title="My Account"
                            type="button">

                            <span class="account-avatar">

                                <lightning-icon
                                    icon-name="utility:user"
                                    size="x-small"
                                    alternative-text="Account">
                                </lightning-icon>

                            </span>

                            <span class="account-label">
                                My Account
                            </span>

                        </button>

                    </template>

                </div>
            </div>
        </header>

       </div>
      </div>

    </template>
</template>
