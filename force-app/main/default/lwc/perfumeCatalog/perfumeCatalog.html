<template>
    <section class="catalog-container">

        <!-- Header -->
        <div class="catalog-header">
            <p class="eyebrow">THE SCENTSPHERE COLLECTION</p>

            <h1>Discover Your Signature Scent</h1>

            <p class="subtitle">
                Explore fragrances crafted to leave a lasting impression.
            </p>
        </div>

        <!-- Search + Filters -->
        <div class="filter-bar">

            <div class="filter-row">

                <!-- Gender pills -->
                <div class="filter-group">
                    <span class="filter-label">Gender</span>

                    <div
                        class="pill-group"
                        role="group"
                        aria-label="Filter by gender">

                        <template for:each={genderPills} for:item="pill">
                            <button
                                key={pill.key}
                                type="button"
                                class={pill.className}
                                data-value={pill.value}
                                aria-pressed={pill.ariaPressed}
                                onclick={handleGenderPill}>
                                {pill.label}
                            </button>
                        </template>

                    </div>
                </div>

                <!-- Category -->
                <label class="filter-group">
                    <span class="filter-label">Category</span>

                    <span class="select-wrap">
                        <select class="select-input" onchange={handleCategoryChange}>
                            <template for:each={categoryOptions} for:item="option">
                                <option
                                    key={option.key}
                                    value={option.value}
                                    selected={option.selected}>
                                    {option.label}
                                </option>
                            </template>
                        </select>
                    </span>
                </label>

                <!-- Brand -->
                <label class="filter-group">
                    <span class="filter-label">Brand</span>

                    <span class="select-wrap">
                        <select class="select-input" onchange={handleBrandChange}>
                            <template for:each={brandOptions} for:item="option">
                                <option
                                    key={option.key}
                                    value={option.value}
                                    selected={option.selected}>
                                    {option.label}
                                </option>
                            </template>
                        </select>
                    </span>
                </label>

                <!-- Sort -->
                <label class="filter-group sort-group">
                    <span class="filter-label">Sort By</span>

                    <span class="select-wrap">
                        <select class="select-input" onchange={handleSortChange}>
                            <template for:each={sortOptions} for:item="option">
                                <option
                                    key={option.key}
                                    value={option.value}
                                    selected={option.selected}>
                                    {option.label}
                                </option>
                            </template>
                        </select>
                    </span>
                </label>

            </div>

            <!-- Active filters -->
            <template if:true={hasActiveFilters}>
                <div class="active-filters">

                    <span class="active-label">Active filters:</span>

                    <template for:each={activeFilters} for:item="chip">
                        <button
                            key={chip.key}
                            type="button"
                            class="chip"
                            data-type={chip.key}
                            aria-label={chip.ariaLabel}
                            onclick={handleRemoveFilter}>
                            {chip.label}
                            <span class="chip-x" aria-hidden="true">&times;</span>
                        </button>
                    </template>

                    <button
                        type="button"
                        class="clear-all"
                        onclick={handleClearFilters}>
                        Clear all
                    </button>

                </div>
            </template>

        </div>

        <!-- Product Count -->
        <div class="results-header">
            <h2>Our Fragrances</h2>

            <span>
                Showing {visibleProductCount} of {productCount} Products
            </span>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="message">
                <lightning-spinner
                    alternative-text="Loading fragrances"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={errorMessage}>
            <div class="message error-message">
                {errorMessage}
            </div>
        </template>

        <!-- Products -->
        <template if:true={hasProducts}>

            <div class="product-grid">

                <template for:each={visibleProducts} for:item="product">

                    <article
                        class="product-card"
                        key={product.Id}
                        data-id={product.Id}
                        onclick={handleCardClick}
                        onkeydown={handleCardKeydown}
                        tabindex="0"
                        role="link"
                        aria-label="View perfume details">

                        <!-- Product Image -->
                        <div class="product-image">

                            <template if:true={product.imageUrl}>
                                <img
                                    src={product.imageUrl}
                                    alt={product.Product_Name__c}>
                            </template>

                            <template if:false={product.imageUrl}>
                                <div class="image-placeholder">
                                    <span>SCENTSPHERE</span>
                                </div>
                            </template>

                            <!-- Out Of Stock Overlay -->
                            <template if:true={product.isOutOfStock}>
                                <div class="out-of-stock-overlay">
                                    <span class="out-of-stock-strip">
                                        OUT OF STOCK
                                    </span>
                                </div>
                            </template>

                            <!-- Wishlist Heart Button -->
                            <div
                                class="wishlist-action"
                                onclick={stopCardNavigation}>

                                <c-wishlist-button
                                    perfume-id={product.Id}>
                                </c-wishlist-button>

                            </div>

                        </div>

                        <!-- Product Information -->
                        <div class="product-info">

                            <p class="product-brand">
                                {product.Brand__c}
                            </p>

                            <h3>{product.Product_Name__c}</h3>

                            <p class="product-description">
                                {product.Description__c}
                            </p>

                            <div class="product-meta">
                                <span>{product.Category__c}</span>
                                <span>{product.Size__c}</span>
                            </div>

                            <!-- Product Footer -->
                            <div class="product-footer">

                                <span class="product-price">
                                    {product.formattedPrice}
                                </span>

                                <button
                                    class="view-details-button"
                                    data-id={product.Id}
                                    onclick={handleViewDetails}>
                                    View Details →
                                </button>

                            </div>

                        </div>

                    </article>

                </template>

            </div>

        </template>

        <!-- Load More Button -->
        <template if:true={showLoadMore}>
            <div class="load-more-section">

                <button
                    class="load-more-button"
                    onclick={handleLoadMore}>

                    Load More Fragrances
                    <span>↓</span>

                </button>

            </div>
        </template>

        <!-- Empty State -->
        <template if:true={showEmpty}>

            <div class="message empty-message">
                <h3>No fragrances found</h3>
                <p>Try changing your search or filters.</p>
            </div>

        </template>

    </section>
</template>
